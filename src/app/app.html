<h1>Angular</h1>
<courses [isFavorite]="post.isFavorite" (change)="onFavoriteChanged($event)">
  <!-- following content must be inside courses selector for ng-content usage -->
  <ng-container class="heading">Heading</ng-container>
  <!-- ng-container - saving markups, saving extra divs -->
  <div class="body">
    <h2>Body</h2>
    <p>Some Content here...</p>
  </div>
</courses>

<!-- isFavorite is input, 
'change' event is Output -->

<like [likesCount]="tweet.likesCount" [isActive]="tweet.isLiked"> </like>

<div *ngIf="courses.length > 0; else noCourses">
  <!-- also can use - [ngIf] -->
  List of Courses
</div>

<ng-template #noCourses> No Courses yet </ng-template>

<ul class="nav nav-pills">
  <li [class.active]="viewMode == 'map'">
    <a [style.text-decoration]="'underline'" (click)="viewMode = 'map'">Map View</a>
  </li>
  <br />
  <li [class.active]="viewMode == 'list'">
    <a [style.text-decoration]="'underline'" (click)="viewMode = 'list'">List View</a>
  </li>
</ul>

<div [ngSwitch]="viewMode">
  <div *ngSwitchCase="'map'">Map View Content</div>
  <div *ngSwitchCase="'list'">List View Content</div>
  <div *ngSwitchDefault>Otherwise</div>
</div>
